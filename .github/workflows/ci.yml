name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Check code quality
        run: python -m ruff check .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t inventory:test .
      - name: Run tests inside the image
        run: docker run --rm inventory:test python -m pytest -q
      - name: Check code quality inside the image
        run: docker run --rm inventory:test python -m ruff check .
